<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Detective Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7ecdf; --paper:#fffcf6; --paper-2:#fdf6ea; --ink:#4a3b52; --ink-soft:#7a6b82;
    --mauve:#c98ba6; --mauve-dark:#a8688c; --mint:#9fcbb0; --mint-dark:#5f9a7c;
    --coral:#e2725b; --lavender:#cbb8e8; --lavender-dark:#a487d4; --tan:#e8d6a8;
    --line:#e3d3b6; --locked:#cabfc9; --shadow-ink: rgba(74,59,82,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 1px 1px, rgba(74,59,82,0.06) 1px, transparent 0) 0 0/22px 22px, var(--bg);
    color:var(--ink); font-family:'Quicksand', sans-serif; font-weight:500; min-height:100vh; padding-bottom:60px;
  }
  h1,h2,h3,h4{font-family:'Fredoka', sans-serif; margin:0; color:var(--ink);}
  .typewriter{font-family:'Special Elite', monospace;}
  .wrap{max-width:1180px; margin:0 auto; padding:26px 20px 0;}

  /* Case tabs */
  .case-tabs{display:flex; gap:8px; margin-bottom:-3px; position:relative; z-index:2; flex-wrap:wrap;}
  .case-tab{
    font-family:'Fredoka'; font-weight:600; font-size:0.82rem;
    background:var(--paper-2); border:3px solid var(--ink); border-bottom:none;
    border-radius:10px 10px 0 0; padding:8px 16px 12px; cursor:pointer; color:var(--ink-soft);
  }
  .case-tab.active{background:var(--tan); color:var(--ink);}
  .case-tab .num{font-family:'Special Elite'; font-size:0.7rem; display:block; opacity:0.7;}

  .folder-header{
    position:relative; background:var(--tan); border:3px solid var(--ink); border-bottom:none;
    border-radius:0 14px 0 0; padding:22px 26px 16px; display:flex; align-items:flex-end;
    justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .header-left{position:relative; z-index:1;}
  .kicker{font-family:'Special Elite', monospace; font-size:0.78rem; letter-spacing:1px; color:var(--ink-soft); margin-bottom:4px;}
  .header-left h1{font-size:clamp(1.5rem, 3vw, 2.3rem); line-height:1.08;}
  .header-left h1 span{color:var(--coral);}
  .stamp{
    font-family:'Special Elite', monospace; display:inline-block; border:2.5px solid var(--coral); color:var(--coral);
    padding:3px 10px; border-radius:4px; transform:rotate(-4deg); font-size:0.72rem; letter-spacing:1.5px; margin-top:8px;
  }
  .agent-box{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:10px; padding:10px 16px;
    min-width:200px; box-shadow:4px 4px 0 var(--shadow-ink);
  }
  .agent-box label{font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .agent-box input{
    font-family:'Fredoka', sans-serif; font-size:1rem; font-weight:600; border:none; border-bottom:2px dashed var(--line);
    background:transparent; color:var(--ink); width:100%; padding:2px 0 4px;
  }
  .agent-box input:focus{outline:none; border-color:var(--mauve);}

  .board{
    background:var(--paper); border:3px solid var(--ink); border-radius:0 0 14px 14px; padding:26px;
    display:grid; grid-template-columns:260px 1fr; gap:22px;
  }
  @media (max-width:820px){.board{grid-template-columns:1fr;}}

  .sidebar{display:flex; flex-direction:column; gap:18px;}
  .scoreboard{background:var(--paper-2); border:2.5px solid var(--ink); border-radius:12px; padding:16px 16px 12px;}
  .scoreboard h3{font-size:1rem; display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .score-total{font-family:'Fredoka'; font-size:2.1rem; color:var(--mauve-dark); line-height:1; margin-bottom:2px;}
  .score-total small{font-family:'Quicksand'; font-size:0.85rem; color:var(--ink-soft); font-weight:600;}
  .skill-row{display:flex; align-items:center; justify-content:space-between; font-size:0.82rem; padding:5px 0; border-top:1px dashed var(--line);}
  .skill-row:first-of-type{border-top:none; margin-top:8px;}
  .stars{letter-spacing:1px; color:var(--mint-dark);}
  .stars .dim{color:var(--line);}

  .trail{background:var(--paper-2); border:2.5px solid var(--ink); border-radius:12px; padding:16px; position:relative;}
  .trail h3{font-size:1rem; margin-bottom:12px;}
  .trail-list{list-style:none; margin:0; padding:0; position:relative;}
  .trail-list::before{
    content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px;
    background-image:linear-gradient(var(--coral) 60%, transparent 0); background-size:2px 8px;
    background-repeat:repeat-y; opacity:0.55;
  }
  .trail-item{position:relative; padding:8px 0 8px 40px; cursor:pointer; border-radius:8px;}
  .trail-item:hover{background:rgba(201,139,166,0.12);}
  .trail-item .pin{
    position:absolute; left:2px; top:7px; width:26px; height:26px; border-radius:50%; border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; background:var(--paper); z-index:1;
  }
  .trail-item.done .pin{background:var(--mint); border-color:var(--mint-dark);}
  .trail-item.active .pin{background:var(--coral); border-color:var(--ink); color:#fff;}
  .trail-item.locked{cursor:not-allowed; opacity:0.55;}
  .trail-item.locked .pin{background:var(--locked);}
  .trail-item .label{font-size:0.8rem; font-weight:600; line-height:1.15;}
  .trail-item.active .label{color:var(--coral);}

  .stage{
    background:var(--paper-2); border:2.5px solid var(--ink); border-radius:12px; padding:26px;
    min-height:420px; position:relative; overflow:hidden;
  }
  .stage::before{
    content:""; position:absolute; top:14px; right:14px; width:46px;height:46px; background:var(--lavender);
    border:2.5px solid var(--ink); border-radius:50%; opacity:0.9;
  }
  .stage-eyebrow{font-family:'Special Elite', monospace; font-size:0.75rem; color:var(--ink-soft); margin-bottom:4px;}
  .stage h2{font-size:1.4rem; margin-bottom:6px; max-width:80%;}
  .stage-sub{color:var(--ink-soft); font-size:0.9rem; margin-bottom:18px; max-width:82%;}
  .clue-tag{
    display:inline-block; font-family:'Special Elite', monospace; font-size:0.7rem; background:var(--coral);
    color:#fff; padding:2px 8px; border-radius:4px; margin-right:6px; transform:rotate(-2deg);
  }
  .card{background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px;}
  .card.story p{font-family:'Special Elite', monospace; font-size:0.86rem; line-height:1.75; margin:0 0 12px;}
  .card.story p:last-child{margin-bottom:0;}
  .card.story p.letter{padding-left:16px; border-left:3px solid var(--mauve); font-style:italic;}

  .q-block{margin-bottom:20px;}
  .q-block:last-child{margin-bottom:0;}
  .q-prompt{font-weight:700; margin-bottom:10px; font-size:0.95rem;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    text-align:left; background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:9px 14px;
    font-family:'Quicksand'; font-weight:600; font-size:0.88rem; color:var(--ink); cursor:pointer;
    box-shadow:3px 3px 0 var(--shadow-ink); transition:transform .08s ease;
  }
  .opt:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow-ink);}
  .opt.correct{background:var(--mint); border-color:var(--mint-dark);}
  .opt.wrong{background:#f3c9c0; border-color:var(--coral);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:8px; font-size:0.83rem; padding:8px 12px; border-radius:8px; display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:rgba(159,203,176,0.35); color:var(--mint-dark);}
  .feedback.bad{background:rgba(226,114,91,0.18); color:var(--coral);}

  textarea{
    width:100%; min-height:100px; font-family:'Quicksand'; font-size:0.9rem; color:var(--ink);
    border:2px solid var(--ink); border-radius:8px; padding:12px; resize:vertical; background:var(--paper);
  }
  textarea:focus{outline:none; border-color:var(--mauve);}
  input[type=text].line-input{
    width:100%; font-family:'Quicksand'; font-weight:600; font-size:0.88rem; color:var(--ink);
    border:none; border-bottom:2px dashed var(--line); background:transparent; padding:4px 2px;
  }
  input[type=text].line-input:focus{outline:none; border-color:var(--mauve);}

  .reveal-btn, .btn{
    font-family:'Fredoka'; font-weight:600; font-size:0.86rem; border:2.5px solid var(--ink); background:var(--lavender);
    color:var(--ink); padding:9px 18px; border-radius:8px; cursor:pointer; box-shadow:3px 3px 0 var(--shadow-ink); margin-top:6px;
  }
  .reveal-btn:hover, .btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow-ink);}
  .btn.primary{background:var(--coral); color:#fff;}
  .btn.mint{background:var(--mint);}
  .btn:disabled{opacity:0.45; cursor:not-allowed; box-shadow:none; transform:none;}
  .sample-answer{
    display:none; margin-top:10px; background:var(--paper-2); border-left:4px solid var(--mauve);
    padding:10px 14px; font-size:0.85rem; border-radius:0 8px 8px 0;
  }
  .sample-answer.show{display:block;}
  .paper-note{background:var(--tan); border:2px dashed var(--ink); border-radius:10px; padding:14px 16px; font-size:0.85rem; margin-bottom:16px;}
  .paper-note b{font-family:'Fredoka';}
  .checkline{display:flex; align-items:center; gap:10px; font-weight:700; font-size:0.9rem; margin-top:10px;}
  .checkline input{width:20px; height:20px; accent-color:var(--mauve-dark);}
  .stage-footer{margin-top:22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .stage-footer .status{font-size:0.8rem; color:var(--ink-soft); font-style:italic;}
  .word-parts{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
  .word-parts span{font-family:'Special Elite'; background:var(--paper-2); border:2px solid var(--ink); border-radius:6px; padding:4px 9px; font-size:0.85rem;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
  .suspect-card{border:2px solid var(--ink); border-radius:10px; padding:12px 14px; background:var(--paper);}
  .suspect-card h4{font-size:0.95rem; margin-bottom:4px;}
  .suspect-card p{font-size:0.82rem; color:var(--ink-soft); margin:0 0 8px;}
  select{
    width:100%; font-family:'Quicksand'; font-weight:700; font-size:0.85rem; padding:6px 8px;
    border:2px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  }
  table.log{width:100%; border-collapse:collapse; font-size:0.85rem;}
  table.log th{font-family:'Fredoka'; text-align:left; font-size:0.78rem; color:var(--ink-soft); padding:6px 8px; border-bottom:2px solid var(--ink);}
  table.log td{padding:8px; vertical-align:top; border-bottom:1px dashed var(--line);}
  table.log td.ev{font-family:'Special Elite'; font-size:0.78rem; width:38%;}
  .closed-banner{text-align:center; padding:26px 20px 6px;}
  .closed-banner .stamp-big{
    display:inline-block; font-family:'Special Elite'; font-size:1.5rem; border:4px solid var(--coral); color:var(--coral);
    padding:10px 26px; border-radius:8px; transform:rotate(-4deg); margin-bottom:16px;
  }
  .journal-day{border:2px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:10px; background:var(--paper);}
  .journal-day h4{font-size:0.9rem; margin-bottom:4px;}
  .journal-day p{font-size:0.82rem; color:var(--ink-soft); margin:0;}

  .case-tab.trophy-tab{background:#f6e6b8; border-color:var(--ink); margin-left:auto;}
  .case-tab.trophy-tab.active{background:#f0d281;}

  .lb-summary-card{
    background:var(--paper); border:2px solid var(--ink); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .lb-summary-card h4{font-size:0.88rem; margin-bottom:4px;}
  .lb-summary-card .lb-best{font-family:'Fredoka'; font-size:1.4rem; color:var(--mauve-dark);}
  .lb-summary-card .lb-best small{font-family:'Quicksand'; font-size:0.78rem; color:var(--ink-soft);}
  .medal{font-size:1rem;}

  .lb-add-form{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .lb-add-form label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); display:block; margin-bottom:3px;}
  .lb-add-form input, .lb-add-form select{
    width:100%; font-family:'Quicksand'; font-weight:600; font-size:0.85rem; padding:7px 9px;
    border:2px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  }
  .lb-add-form .full{grid-column:1 / -1;}
  @media(max-width:560px){.lb-add-form{grid-template-columns:1fr;}}

  table.lb-table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  table.lb-table th{font-family:'Fredoka'; text-align:left; font-size:0.75rem; color:var(--ink-soft); padding:8px; border-bottom:2px solid var(--ink);}
  table.lb-table td{padding:9px 8px; border-bottom:1px dashed var(--line); vertical-align:middle;}
  table.lb-table tr:last-child td{border-bottom:none;}
  .lb-score{font-family:'Fredoka'; font-weight:600;}
  .lb-remove{
    background:none; border:none; color:var(--coral); font-size:1rem; cursor:pointer; padding:2px 6px;
    font-family:'Fredoka';
  }
  .lb-empty{color:var(--ink-soft); font-size:0.85rem; font-style:italic; padding:8px 0;}

  footer.tag{text-align:center; font-size:0.75rem; color:var(--ink-soft); margin-top:18px; font-family:'Special Elite';}
</style>
</head>
<body>
<div class="wrap">
  <div class="case-tabs" id="caseTabs"></div>
  <div class="folder-header">
    <div class="header-left">
      <div class="kicker" id="hKicker">🔎 CONFIDENTIAL — DETECTIVE FILES DIVISION</div>
      <h1 id="hTitle"></h1>
      <div class="stamp" id="hStamp"></div>
    </div>
    <div class="agent-box">
      <label>Lead Detective</label>
      <input id="agentName" type="text" placeholder="Type your name..." />
    </div>
  </div>
  <div class="board">
    <div class="sidebar">
      <div class="scoreboard">
        <h3>⭐ Detective Score</h3>
        <div class="score-total" id="totalStars">0 <small>/ 0 stars</small></div>
        <div id="skillRows"></div>
      </div>
      <div class="trail">
        <h3>🗺️ Case Trail</h3>
        <ul class="trail-list" id="trailList"></ul>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
  <footer class="tag">— every clue earns a star. no guessing, only proving. —</footer>
</div>

<script>
/* ============================================================
   SHARED HELPERS (used by both cases)
   ============================================================ */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

function buildMCQuiz(container, station, questions, ctx){
  let correct = 0;
  const graded = questions.length;
  questions.forEach((item, idx)=>{
    const block = el(`<div class="q-block card"><div class="q-prompt">${idx+1}. ${item.q}</div></div>`);
    const opts = el(`<div class="opts"></div>`);
    let fb = null;
    if(item.why){
      fb = el(`<div class="feedback"></div>`);
    }
    item.opts.forEach((label, oi)=>{
      const b = el(`<button class="opt">${label}</button>`);
      b.addEventListener("click", ()=>{
        [...opts.children].forEach(c=>c.disabled=true);
        if(oi===item.correct){ b.classList.add("correct"); correct++; }
        else { b.classList.add("wrong"); opts.children[item.correct].classList.add("correct"); }
        if(fb){
          fb.classList.add("show", oi===item.correct?"good":"bad");
          fb.textContent = item.why;
        }
        ctx.awardStars(station.id, Math.round(correct/graded*station.maxStars));
        ctx.refresh();
      });
      opts.appendChild(b);
    });
    block.appendChild(opts);
    if(fb) block.appendChild(fb);
    container.appendChild(block);
  });
}

function buildFreeResponse(container, station, items, ctx, keyPrefix, groups){
  groups = groups || [[keyPrefix, items.length]];
  items.forEach((item, idx)=>{
    const savedKey = keyPrefix+"_"+idx;
    const block = el(`
      <div class="card q-block">
        ${item.intro ? `<div class="card story" style="margin-bottom:12px;"><p>${item.intro}</p></div>` : ""}
        <div class="q-prompt">${idx+1}. ${item.q}</div>
        <textarea placeholder="Type your answer here...">${ctx.getAnswer(savedKey)||""}</textarea>
        <button class="reveal-btn">🔎 Compare with case notes</button>
        <div class="sample-answer">${item.sample}</div>
      </div>`);
    const ta = block.querySelector("textarea");
    const btn = block.querySelector(".reveal-btn");
    const sample = block.querySelector(".sample-answer");
    ta.addEventListener("input", ()=>{ ctx.setAnswer(savedKey, ta.value); });
    btn.addEventListener("click", ()=>{
      sample.classList.add("show");
      if(!ctx.getAnswer(savedKey+"_revealed")){
        ctx.setAnswer(savedKey+"_revealed", true);
        let n=0, total=0;
        groups.forEach(([p,len])=>{ total+=len; for(let i=0;i<len;i++){ if(ctx.getAnswer(p+"_"+i+"_revealed")) n++; } });
        ctx.awardStars(station.id, Math.round(n/total*station.maxStars));
        ctx.refresh();
      }
    });
    container.appendChild(block);
  });
}

function buildPaperTask(container, station, noteHtml, checkLabel, ctx, key){
  container.appendChild(el(`<div class="paper-note">${noteHtml}</div>`));
  const check = el(`<label class="checkline"><input type="checkbox"> ${checkLabel}</label>`);
  const cb = check.querySelector("input");
  cb.checked = !!ctx.getAnswer(key);
  cb.addEventListener("change", ()=>{
    ctx.setAnswer(key, cb.checked);
    ctx.awardStars(station.id, cb.checked ? station.maxStars : 0);
    ctx.refresh();
  });
  if(cb.checked) ctx.awardStars(station.id, station.maxStars);
  container.appendChild(check);
}

/* ============================================================
   CASE #001 — THE MISSING TROPHY
   ============================================================ */
const CASE1_WARMUP_STORY = `Ms. Reyes got back from the staff room to find the classroom door wide open. A blue backpack sat on the floor beside one of the desks, and a half-finished worksheet lay next to it, the pencil still resting on top.`;
const CASE1_WARMUP_Q = [
  {q:"The classroom door was open.", opts:["Fact","Inference"], correct:0, why:"Stated directly in the passage — nothing to figure out."},
  {q:"Someone probably left the classroom recently.", opts:["Fact","Inference"], correct:1, why:"The open door plus the pencil still resting on an unfinished worksheet suggest this — but it isn't stated outright."},
  {q:"There was a blue backpack beside the desk.", opts:["Fact","Inference"], correct:0, why:"Directly stated — a fact."},
  {q:"The person who left was probably a student.", opts:["Fact","Inference"], correct:1, why:"A backpack and a worksheet suggest a student, but the passage never says who it was."}
];
const CASE1_STORY = [
  "It was Monday morning when Ms. Patel noticed something unusual.",
  "The glass trophy cabinet near the front office was supposed to contain six trophies from the school's annual competitions. Five trophies were sitting exactly where they belonged. The sixth was missing — the Greenwood Science Challenge Trophy, a silver cup the school had won three years in a row.",
  "Ms. Patel immediately checked the cabinet. There was no broken glass, and the lock did not appear damaged. \"Interesting,\" she said.",
  "She called three students who had been near the office that morning: Evan, Sophie, and Marcus.",
  "Evan arrived first. \"I was here around 8:05,\" he explained. \"I was dropping off my science project because I didn't want it to get damaged on the bus.\" He was carrying a large cardboard box — inside was, in fact, a volcano.",
  "Next came Sophie. \"I came to the office at about 8:15. I needed to hand in a permission form.\" \"Did you see the trophy?\" \"No. But I remember seeing the cabinet.\"",
  "Marcus arrived last. \"I wasn't near the office this morning. I was in the library.\" Then the school librarian, Mr. Chen, walked in. \"I actually saw Marcus this morning — he came into the library at 8:10.\" Marcus looked relieved.",
  "But Ms. Patel wasn't finished. She examined the floor near the trophy cabinet and found several tiny drops of green paint. She looked at Evan's cardboard box — there was green paint on the side, too. Evan immediately looked nervous.",
  "\"Wait!\" he said. \"That doesn't mean I took the trophy!\" Ms. Patel examined the paint more closely. \"You're right. It doesn't.\" Then she noticed something else: the green paint was still wet.",
  "\"Where did you paint your volcano?\" she asked. \"In the art room.\" \"When?\" \"Yesterday afternoon.\" Ms. Patel smiled. \"Then your paint shouldn't still be wet.\" Evan's face went pale."
];
const CASE1_STORY_2 = [
  "\"Wait,\" Evan said. \"I know why that's there.\" He opened his cardboard box and pulled out a small paintbrush. \"My volcano broke this morning. I had to repaint one side before I brought it to school.\"",
  "Ms. Patel examined the box again. The green paint matched the paint on Evan's volcano exactly. \"So you painted this morning?\" she asked. Evan nodded. \"Yes. That's why it's still wet.\" The paint had come from Evan's box — not from the trophy cabinet. Evan was no longer a strong suspect.",
  "Ms. Patel thought back to Marcus's story. \"I wasn't near the office this morning. I was in the library,\" he had said — and Mr. Chen had confirmed seeing him there at 8:10.",
  "She checked the library's sign-in sheet. Marcus had signed in at 8:10. His story appeared to be true. But then she checked the security camera. The footage showed Marcus entering the library at 8:10... alone. Nobody was there to see him.",
  "Mr. Chen had lied. He hadn't actually seen Marcus at 8:10 — he'd said it to give his nephew an alibi. Marcus had taken the trophy to use as a prop for a school project, planning to return it later, but panicked when it was discovered missing.",
  "The trophy was found hidden behind a stack of old books in the library. Marcus admitted taking it. Mr. Chen admitted lying about seeing him."
];
const CASE1_INTERRO_Q = [
  {q:"What was missing from the trophy cabinet?", sample:"The Greenwood Science Challenge Trophy."},

function makeSeqQ(idx, a, b, c, correct){
  const perms = ["A → B → C","A → C → B","B → A → C","B → C → A","C → A → B","C → B → A"];
  const distractors = perms.filter(p=>p!==correct);
  const opts = [distractors[idx % 5], distractors[(idx+2) % 5]];
  const pos = idx % 3;
  opts.splice(pos, 0, correct);
  return {q:"Put these events in order:<br>A. "+a+"<br>B. "+b+"<br>C. "+c, opts:opts, correct:pos};
}

const CASES = {"001": CASE1, "002": CASE2, "003": CASE3};

/* ============================================================
   ENGINE
   ============================================================ */
const SKILL_ORDER = ["Focus","Evidence","Reading","Sequencing","Summarizing","Vocabulary","Spelling","Writing"];
const STORE_KEY = "detectiveFiles_progress_v2";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(!p.log) p.log = [];
      if(!p.view) p.view = "case";
      return p;
    }
  }catch(e){}
  // Fresh install: seed the leaderboard with the first in-person session's score.
  return {
    agent:"", activeCase:"001", view:"case", data:{},
    log:[{ id: "seed-1", when:"Session 1", caseId:"001", caseLabel:"Missing Trophy", stars:24, max:24, note:"Perfect score!", source:"manual" }]
  };
}
function saveProgress(){ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
let progress = loadProgress();
let lbEntrySeq = 1;

function caseData(caseId){
  if(!progress.data[caseId]) progress.data[caseId] = { current:0, completed:{}, stars:{}, answers:{} };
  return progress.data[caseId];
}

function makeCtx(caseId){
  const cs = caseData(caseId);
  return {
    getAgent: ()=>progress.agent,
    getAnswer: (k)=>cs.answers[k],
    setAnswer: (k,v)=>{ cs.answers[k]=v; saveProgress(); },
    awardStars: (stationId, n)=>{
      const caseObj = CASES[caseId];
      const st = caseObj.stations.find(s=>s.id===stationId);
      cs.stars[stationId] = Math.max(0, Math.min(n, st.maxStars));
    },
    isComplete: (id)=>!!cs.completed[id],
    markComplete: (id)=>{ cs.completed[id]=true; saveProgress(); renderSidebar(); },
    totalStars: ()=>Object.values(cs.stars).reduce((a,b)=>a+b,0),
    maxTotalStars: ()=>CASES[caseId].stations.reduce((a,s)=>a+s.maxStars,0),
    refresh: ()=>{ saveProgress(); renderSidebar(); },
    logCompletion: ()=>{
      const caseObj = CASES[caseId];
      const stars = Object.values(cs.stars).reduce((a,b)=>a+b,0);
      const max = caseObj.stations.reduce((a,s)=>a+s.maxStars,0);
      progress.log.push({
        id: "auto-"+caseId+"-"+Date.now()+"-"+(lbEntrySeq++),
        when: new Date().toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"}),
        caseId, caseLabel: caseObj.tabSub, stars, max, note:"", source:"auto"
      });
      saveProgress();
    }
  };
}

function isUnlocked(caseId, id){
  if(id===0) return true;
  const cs = caseData(caseId);
  return !!cs.completed[id-1];
}

function stageHeader(stage, eyebrow, title, sub){
  stage.appendChild(el(`<div><div class="stage-eyebrow">${eyebrow}</div><h2>${title}</h2><p class="stage-sub">${sub}</p></div>`));
}
function footer(stage, s, ctx){
  const done = ctx.isComplete(s.id);
  const f = el(`<div class="stage-footer"><span class="status">${done?"✓ Filed away":"Not filed yet"}</span></div>`);
  const stations = CASES[progress.activeCase].stations;
  const isLast = s.id === stations.length-2;
  const btn = el(`<button class="btn primary">${done?"Continue":(isLast?"File Final Report →":"Mark Solved & Continue →")}</button>`);
  btn.addEventListener("click", ()=>{
    if(!done) ctx.markComplete(s.id);
    const nextId = s.id+1;
    if(nextId < stations.length){
      caseData(progress.activeCase).current = nextId;
      saveProgress();
      render();
    }
  });
  f.appendChild(btn);
  stage.appendChild(f);
}

function renderTabs(){
  const tabs = document.getElementById("caseTabs");
  tabs.innerHTML = "";
  Object.values(CASES).forEach(c=>{
    const active = progress.view==="case" && progress.activeCase===c.id;
    const tab = el(`<div class="case-tab ${active?"active":""}"><span class="num">${c.tabLabel}</span>${c.tabSub}</div>`);
    tab.addEventListener("click", ()=>{
      progress.view = "case";
      progress.activeCase = c.id;
      saveProgress();
      render();
    });
    tabs.appendChild(tab);
  });
  const lbActive = progress.view==="leaderboard";
  const lbTab = el(`<div class="case-tab trophy-tab ${lbActive?"active":""}"><span class="num">🏆 Hall of Fame</span>Leaderboard</div>`);
  lbTab.addEventListener("click", ()=>{
    progress.view = "leaderboard";
    saveProgress();
    render();
  });
  tabs.appendChild(lbTab);
}

function renderHeader(){
  const c = CASES[progress.activeCase];
  document.getElementById("hTitle").innerHTML = c.title;
  document.getElementById("hStamp").textContent = c.stamp;
}

function renderSidebar(){
  const caseId = progress.activeCase;
  const c = CASES[caseId];
  const ctx = makeCtx(caseId);
  const cs = caseData(caseId);

  document.querySelector(".scoreboard h3").textContent = "⭐ Detective Score";
  document.querySelector(".trail h3").textContent = "🗺️ Case Trail";
  document.getElementById("totalStars").innerHTML = ctx.totalStars() + ` <small>/ ${ctx.maxTotalStars()} stars</small>`;

  const skillMax = {};
  c.stations.forEach(s=>{ if(s.maxStars>0) skillMax[s.skill]=(skillMax[s.skill]||0)+s.maxStars; });

  const skillRows = document.getElementById("skillRows");
  skillRows.innerHTML = "";
  SKILL_ORDER.filter(sk=>skillMax[sk]).forEach(skill=>{
    const max = skillMax[skill];
    let got = 0;
    c.stations.forEach(s=>{ if(s.skill===skill) got += (cs.stars[s.id]||0); });
    let starsHtml = "";
    for(let i=0;i<max;i++) starsHtml += i<got ? "★" : `<span class="dim">★</span>`;
    skillRows.appendChild(el(`<div class="skill-row"><span>${skill}</span><span class="stars">${starsHtml}</span></div>`));
  });

  const trailList = document.getElementById("trailList");
  trailList.innerHTML = "";
  c.stations.forEach(s=>{
    const done = !!cs.completed[s.id];
    const unlocked = isUnlocked(caseId, s.id);
    const active = cs.current === s.id;
    const li = el(`<li class="trail-item ${done?"done":""} ${active?"active":""} ${!unlocked?"locked":""}">
      <span class="pin">${done?"✓":(unlocked?s.icon:"🔒")}</span><span class="label">${s.label}</span></li>`);
    if(unlocked) li.addEventListener("click", ()=>{ cs.current=s.id; saveProgress(); render(); });
    trailList.appendChild(li);
  });
}

function renderStage(){
  const caseId = progress.activeCase;
  const c = CASES[caseId];
  const cs = caseData(caseId);
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const s = c.stations.find(st=>st.id===cs.current);
  if(!isUnlocked(caseId, s.id)){
    stage.innerHTML = `<div class="stage-eyebrow">LOCKED FILE</div><h2>🔒 Not yet, detective.</h2><p class="stage-sub">Finish the previous case file first — every clue builds on the last one.</p>`;
    return;
  }
  s.render(stage, s, makeCtx(caseId));
}

/* ============================================================
   LEADERBOARD PAGE
   ============================================================ */
function renderLeaderboardHeader(){
  document.getElementById("hTitle").innerHTML = "The <span>Hall of Fame</span>";
  document.getElementById("hStamp").textContent = "TOP DETECTIVE";
}

function medalFor(stars, max){
  if(max>0 && stars===max) return "🏅";
  if(max>0 && stars/max >= 0.75) return "⭐";
  return "🔎";
}

function renderLeaderboardSidebar(){
  document.querySelector(".scoreboard h3").textContent = "🏆 Sessions Logged";
  document.getElementById("totalStars").innerHTML =
    progress.log.length + ` <small>${progress.log.length===1?"session logged":"sessions logged"}</small>`;

  const skillRows = document.getElementById("skillRows");
  skillRows.innerHTML = "";
  Object.values(CASES).forEach(c=>{
    const entries = progress.log.filter(e=>e.caseId===c.id);
    const best = entries.reduce((m,e)=> e.stars>m ? e.stars : m, 0);
    const bestMax = entries.length ? entries.find(e=>e.stars===best).max : c.stations.reduce((a,s)=>a+s.maxStars,0);
    skillRows.appendChild(el(`<div class="lb-summary-card">
      <h4>${c.tabLabel} · ${c.tabSub}</h4>
      <div class="lb-best">${entries.length? best : "—"} <small>/ ${bestMax} best${entries.length? " · "+medalFor(best,bestMax):""}</small></div>
    </div>`));
  });

  const trailList = document.getElementById("trailList");
  trailList.innerHTML = "";
  trailList.parentElement.querySelector("h3").textContent = "🏆 Achievements";
  const perfectCases = Object.values(CASES).filter(c=>progress.log.some(e=>e.caseId===c.id && e.max>0 && e.stars===e.max));
  if(perfectCases.length===0){
    trailList.appendChild(el(`<li style="list-style:none; padding:6px 0; font-size:0.82rem; color:var(--ink-soft);">No perfect scores yet — keep investigating!</li>`));
  } else {
    perfectCases.forEach(c=>{
      trailList.appendChild(el(`<li style="list-style:none; padding:6px 0; font-size:0.82rem; font-weight:700;">🏅 ${c.tabSub} — solved perfectly</li>`));
    });
  }
}

function renderLeaderboardStage(){
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  stage.appendChild(el(`<div><div class="stage-eyebrow">HALL OF FAME</div><h2>🏆 The Leaderboard</h2><p class="stage-sub">Every case attempt, filed for the record. Add a session by hand for anything solved on paper.</p></div>`));

    <div class="q-prompt">➕ Log a session</div>
    <div class="lb-add-form">
      <div><label>When</label><input type="text" id="lbWhen" placeholder="e.g. Sept 21, or Session 3" /></div>

      </div>
      <div><label>Stars earned</label><input type="text" id="lbStars" placeholder="e.g. 24" /></div>
      <div><label>Stars possible</label><input type="text" id="lbMax" placeholder="e.g. 24" /></div>
      <div class="full"><label>Note (optional)</label><input type="text" id="lbNote" placeholder="e.g. great focus today!" /></div>

    const tbody = table.querySelector("tbody");
    sorted.forEach(entry=>{

        <td class="lb-score">${medalFor(entry.stars, entry.max)} ${entry.stars}/${entry.max}</td>
        <td style="color:var(--ink-soft); font-size:0.82rem;">${entry.note||""}</td>
        <td><button class="lb-remove" title="Remove entry">✕</button></td>
      `;
      tr.querySelector(".lb-remove").addEventListener("click", ()=>{
        progress.log = progress.log.filter(e=>e.id!==entry.id);
        saveProgress();
        render();
      });
      tbody.appendChild(tr);
    });
    listCard.appendChild(table);
  }
  stage.appendChild(listCard);
}

function render(){
  renderTabs();
  if(progress.view === "leaderboard"){
    renderLeaderboardHeader();
    renderLeaderboardSidebar();
    renderLeaderboardStage();
  } else {
    renderHeader();
    renderSidebar();
    renderStage();
  }
}

const agentInput = document.getElementById("agentName");
agentInput.value = progress.agent || "";
agentInput.addEventListener("input", ()=>{ progress.agent = agentInput.value; saveProgress(); });

render();
</script>
</body>
</html>
